name: Sync GitHub Repo to GitLab

on:
  workflow_dispatch:
    inputs:
      sync_mode:
        description: "Sync mode: main or all"
        required: true
        default: "main"
        type: choice
        options:
          - main
          - all
      prune_deleted_branches:
        description: "If 'all', prune branches deleted on GitHub (true/false)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      sync_tags:
        description: "Sync tags (true/false)"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

  # Optional automatic sync on a schedule, since this public repo
  # won't receive push events from the private source repo.
  #schedule:
    #- cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private GitHub source repo (full history)
        uses: actions/checkout@v4
        with:
          repository: conholdate/product-pages-agent
          ref: main
          token: ${{ secrets.SOURCE_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add GitLab remote (HTTPS + token)
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO: ${{ secrets.GITLAB_REPO }}
        run: |
          set -euo pipefail
          GITLAB_URL="https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO}"
          git remote remove gitlab 2>/dev/null || true
          git remote add gitlab "$GITLAB_URL"
          git remote -v

      - name: Ensure all branches and tags from source GitHub repo are available
        run: |
          set -euo pipefail
          git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*"

      - name: Sync to GitLab
        env:
          SYNC_MODE: ${{ inputs.sync_mode || 'main' }}
          PRUNE: ${{ inputs.prune_deleted_branches || 'false' }}
          SYNC_TAGS: ${{ inputs.sync_tags || 'false' }}
        run: |
          set -euo pipefail
          echo "SYNC_MODE=$SYNC_MODE"
          echo "PRUNE=$PRUNE"
          echo "SYNC_TAGS=$SYNC_TAGS"

          if [ "$SYNC_MODE" = "main" ]; then
            git push gitlab "refs/remotes/origin/main:refs/heads/main"
          else
            if [ "$PRUNE" = "true" ]; then
              git push --prune gitlab "refs/remotes/origin/*:refs/heads/*"
            else
              git push gitlab "refs/remotes/origin/*:refs/heads/*"
            fi
          fi

          if [ "$SYNC_TAGS" = "true" ]; then
            git push gitlab --tags
          fi
